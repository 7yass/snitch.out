name: CI (Release)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish
      # the binary's version is stamped from the git tag so it can never drift
      # from the release (a stale csproj version makes the updater loop)
      # IncludeNativeLibrariesForSelfExtract bundles WebView2Loader.dll into the
      # single exe - without it the standalone download misses the file and the
      # login browser dies with DllNotFoundException
      run: |
        $stamp = @()
        if ("${{ github.ref_type }}" -eq "tag") {
          $v = "${{ github.ref_name }}".TrimStart("v")
          $stamp = @("-p:Version=$v", "-p:FileVersion=$v")
        }
        dotnet publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} @stamp -r win-x64 -c Release --self-contained false .\Bloxstrap\Bloxstrap.csproj

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: snitch.out
        path: .\Bloxstrap\bin\Release\net6.0-windows\win-x64\publish\snitch.out.exe
        archive: false

    - name: Build installer
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart("v")
        if ("${{ github.ref_type }}" -ne "tag") { $version = "0.0.0" }
        choco install innosetup -y --no-progress
        $iscc = @('C:\Program Files\Inno Setup 6\ISCC.exe', 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
        & $iscc /DAppVersion=$version installer/snitch.iss
        Get-ChildItem snitch.out-Setup-*.exe

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: snitch.out-setup
        path: snitch.out-Setup-*.exe
        archive: false

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v7
        with:
          name: snitch.out
          path: release

      - name: Download installer artifact
        uses: actions/download-artifact@v7
        with:
          name: snitch.out-setup
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: |
            release/snitch.out.exe
            release/snitch.out-Setup-*.exe
          name: snitch.out ${{ github.ref_name }}
          body: |
            Run `snitch.out-Setup-*.exe` to install. It checks for the .NET 6 Desktop Runtime for you.
          fail_on_unmatched_files: true
