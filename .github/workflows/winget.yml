name: Publish to Winget

# snitch.out is not on winget yet. To publish it, submit the package
# identifier below to winget-pkgs once, add a WINGET_TOKEN secret, and
# switch this trigger back to `release: types: [released]`.
on:
  workflow_dispatch

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: 7yass.snitch.out
          token: ${{ secrets.WINGET_TOKEN }}
